<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Main Strategy — Helicopter View Market Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Metro house-style (скилл web-design) ===== */
:root{
  --sans:'Manrope',system-ui,sans-serif;
  --monof:'Manrope',system-ui,sans-serif; /* data-слой; выравнивание чисел — tabular-nums */

  /* Типографическая шкала — 5 кеглей, роли закреплены */
  --fs-micro:.6875rem; --fs-meta:.75rem; --fs-body:.875rem; --fs-head:1rem; --fs-display:1.375rem;
  --fw-display:400; --fw-reg:400; --fw-bold:600; --fw-mono-em:500;

  --ink:#1a1a1a; --ink2:#767676; --muted:#9a9a9a;
  --line:#E4E4E4; --rule:#EDEDED; --card:#F8F8F8;
  --blue:#00A4EF; --violet:#7550BE; --yellow:#FFB900;
  --green:#7FBA00; --green-ink:#4C8A00;
  --ok:#4C8A00; --ok-dot:#7FBA00;
  --warn:#C29B00; --warn-dot:#F0B400;
  --red:#D24726; --red-ink:#B83A1C; --red-bg:#FBF1EF;
  --bear:#8E2A9E; --bear-dot:#AA00CC;
  --marker:#0084C0;
  /* алиасы для инлайн-ссылок скрипта (логика байт-в-байт) */
  --sec:var(--ink2); --acc:var(--marker); --red-dot:var(--red);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:var(--ink);font-family:var(--sans);font-size:var(--fs-body);line-height:1.5;-webkit-font-smoothing:antialiased;padding:34px 20px;max-width:1000px;margin:0 auto}
a:focus-visible,button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* шапка сайта */
.sitehead{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.sitehead .brand{display:flex;align-items:center}
.sitehead .brand img{height:23px;width:auto;display:block}
.sitenav{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.sitenav a{font-size:var(--fs-body);font-weight:var(--fw-bold);color:var(--ink);text-decoration:none;padding-bottom:3px;border-bottom:2px solid transparent;transition:color .12s ease}
.sitenav a:hover{color:var(--marker)}
.sitenav a[aria-current="page"]{border-bottom-color:var(--blue)}
.sitenav .cta{border:1px solid var(--green-ink);color:var(--green-ink);padding:6px 16px;border-bottom-width:1px}
.sitenav .cta:hover{color:var(--green-ink)}

.rule4{height:2px;margin-bottom:14px;background:linear-gradient(to right,var(--blue) 0 25%,var(--green) 25% 50%,var(--yellow) 50% 75%,var(--violet) 75% 100%)}

/* header страницы инструмента */
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.hleft{display:flex;align-items:center;gap:10px}
.hbadge{width:30px;height:30px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:var(--fw-bold);font-size:var(--fs-body);flex:none}
h1{font-size:var(--fs-display);font-weight:var(--fw-display);letter-spacing:.01em}
.meta{font-size:var(--fs-micro);color:var(--muted);font-family:var(--monof)}

.warnbar{background:var(--red-bg);border-left:3px solid var(--red);color:var(--red);padding:11px 15px;font-size:var(--fs-body);margin-bottom:15px;display:none}
.livehint{color:var(--ink2);font-size:var(--fs-meta);line-height:1.45;margin-top:12px}

/* сводка QQQ + мастер-статус */
.hdrline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hnums{font-family:var(--monof);font-size:var(--fs-meta);color:var(--ink2);font-variant-numeric:tabular-nums}
.hnums b{color:var(--ink);font-weight:var(--fw-mono-em)}
.hnums .live{color:var(--marker);font-weight:var(--fw-mono-em)}

/* информационная плашка режима — тонкий кант */
.regime{border-left:3px solid var(--blue);padding:8px 14px;margin-bottom:26px}
.regime .t{font-size:var(--fs-body);font-weight:var(--fw-bold);color:var(--ink)}
.regime .s{font-size:var(--fs-meta);color:var(--ink2);margin-top:3px;font-family:var(--monof)}
.regime.crisis{border-left-color:var(--red);background:var(--red-bg)}
.regime.crisis .t,.regime.crisis .s{color:var(--red)}

/* секция компонента: заголовок с 64px подчёркиванием, без рамочного бокса */
.wing{margin-bottom:8px}
.wing-head{position:relative;padding-bottom:10px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.wing-head::after{content:'';position:absolute;left:0;bottom:0;width:64px;height:2px;background:var(--wing,var(--blue))}
.wing-title{font-size:var(--fs-head);font-weight:var(--fw-bold);letter-spacing:.01em;display:inline-flex;align-items:center}
.wing-title::before{content:'';width:10px;height:10px;margin-right:8px;flex:none;background:var(--wing,var(--blue))}
.wing-nums{font-family:var(--monof);font-size:var(--fs-meta);color:var(--ink2);font-variant-numeric:tabular-nums}
.wing-nums b{color:var(--ink);font-weight:var(--fw-mono-em)}
.wing-nums .ref{color:var(--muted)}
.wing.w-tqqq{--wing:var(--blue)}
.wing.w-qdte{--wing:var(--violet)}

.wing-grid{display:grid;grid-template-columns:235px minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:660px){.wing-grid{grid-template-columns:1fr;gap:16px}}

/* разделитель компонентов */
.wingsep{display:flex;align-items:center;gap:14px;margin:30px 0}
.wingsep::before,.wingsep::after{content:'';flex:1;height:1px;background:var(--line)}
.wingsep .w1,.wingsep .w2{width:9px;height:9px;flex:none}
.wingsep .w1{background:var(--blue);margin-right:-11px}
.wingsep .w2{background:var(--violet)}

/* таблица уровней */
.lvls{font-family:var(--monof);font-size:var(--fs-meta);font-variant-numeric:tabular-nums}
.lvls .h{display:grid;grid-template-columns:1fr auto;gap:10px;padding:0 0 5px;color:var(--muted);font-size:var(--fs-micro)}
.lvls .h.q{grid-template-columns:1fr auto auto;gap:12px}
.lvls .l{display:grid;grid-template-columns:1fr auto;gap:10px;padding:6px 0;border-top:1px solid var(--rule);align-items:center}
.lvls .l.q{grid-template-columns:1fr auto auto;gap:12px}
.lvls .l > span:first-child::before{content:'';display:inline-block;width:8px;height:8px;margin-right:7px;background:currentColor;vertical-align:-1px}
.lvls .paren{color:var(--muted)}
.c-cur{color:var(--marker)} .c-y{color:var(--warn)} .c-r{color:var(--red)} .c-b{color:var(--bear)} .c-ok{color:var(--ok)} .c-m{color:var(--ink2)}

/* карточка состояния */
.scard{background:var(--card);border-top:2px solid var(--wing,var(--blue));padding:12px 14px}
.scard .st{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.scard .st .dot{width:9px;height:9px;margin-top:6px;flex:0 0 auto}
.scard .st .lb{font-size:var(--fs-body);font-weight:var(--fw-bold);line-height:1.4}
.scard .ind{font-family:var(--monof);font-size:var(--fs-meta);line-height:1.85;color:var(--ink2);font-variant-numeric:tabular-nums}
.scard .ind b{color:var(--ink);font-weight:var(--fw-mono-em)}
.scard .act{margin-top:11px;padding-top:10px;border-top:1px solid var(--rule);font-size:var(--fs-body);color:var(--ink)}
.scard .act b{font-weight:var(--fw-bold)}

/* статус-бейджи: квадрат + цветной текст, без плашки */
.badge{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-body);font-weight:var(--fw-bold)}
.badge .dot{width:9px;height:9px}
.b-ok{color:var(--ok)}     .b-ok .dot{background:var(--ok-dot)}
.b-warn{color:var(--warn)} .b-warn .dot{background:var(--warn-dot)}
.b-red{color:var(--red)}   .b-red .dot{background:var(--red)}
.b-bear{color:var(--bear)} .b-bear .dot{background:var(--bear-dot)}
.bs-ok{color:var(--ok)}    .bs-ok .dot{background:var(--ok-dot)}
.bs-warn{color:var(--warn)}.bs-warn .dot{background:var(--warn-dot)}
.bs-red{color:var(--red)}  .bs-red .dot{background:var(--red)}

/* здоровье выплат */
.health{border-top:1px solid var(--rule);margin-top:16px;padding-top:15px}
.health-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.health-head .t{font-size:var(--fs-meta);color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;font-weight:var(--fw-bold)}
.health-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hc{background:var(--card);padding:15px 10px;text-align:center}
.hc .n{font-family:var(--monof);font-size:var(--fs-head);font-weight:var(--fw-mono-em);font-variant-numeric:tabular-nums}
.hc .c{font-size:var(--fs-meta);color:var(--ink2);margin-top:5px}

/* подвал сайта */
#sitebottom{visibility:hidden}
.sitefoot{border-top:1px solid var(--rule);margin-top:44px;padding-top:20px;display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:20px}
.sitefoot h2{font-size:var(--fs-meta);font-weight:var(--fw-bold);margin-bottom:8px}
.sitefoot ul{list-style:none}
.sitefoot li{margin-bottom:5px}
.sitefoot a{font-size:var(--fs-meta);color:var(--ink2);text-decoration:none}
.sitefoot a:hover{color:var(--ink)}
.sitefoot p{font-family:var(--monof);font-size:var(--fs-meta);color:var(--ink2);margin-bottom:5px}
@media (max-width:900px){.sitefoot{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.sitefoot{grid-template-columns:1fr}}
.foot{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:26px}
img.fmark{height:17px;width:auto;display:block}
.foot .txt{font-family:var(--monof);font-size:var(--fs-micro);color:var(--muted)}
</style>
</head>

<script>
'use strict';
const $=id=>document.getElementById(id);

/* уровни просадки: множитель к ATH и подпись в % */
const MULT={yellow:0.947,exit:0.888,t1:0.794,t2:0.705,t3:0.585};
const DD={yellow:-5.3,exit:-11.2,t1:-20.6,t2:-29.5,t3:-41.5};

/* параметры модуля аллокации (порт из бэктеста v2.2) */
const MOD={ENTER:0.009,EXIT:0.004,CIN:5,COUT:3,DOX:0.20,DREL:0.18,DRET:0.12,CRET:3,YEL:-0.053,RED:-0.112,SW:10};
const W20='TQQQ 20% / QDTE 80%';      // разгрузка (растяжение)

const W60='TQQQ 60% / QDTE 40%';      // разгон

function log(s){ if(window.console) console.log(s); }

/* форматирование */
const fmt=x=>'$'+x.toFixed(2), f1=x=>'$'+x.toFixed(1);
const pc1=x=>(x>=0?'+':'−')+Math.abs(x).toFixed(1)+'%';   // из числа-процента
const pc2=x=>(x>=0?'+':'−')+Math.abs(x).toFixed(2)+'%';

/* ---- данные через бэкенд Tiingo (ключ на сервере) ---- */
async function getData(sym,start){
  const url=`/api/tiingo?symbol=${encodeURIComponent(sym)}&start=${start||'1999-01-01'}`;
  const r=await fetch(url);
  const js=await r.json();
  if(!r.ok||js.error){throw new Error(js.error?`${sym}: ${js.error}`:`${sym}: HTTP ${r.status}`);}
  if(!Array.isArray(js)||!js.length)throw new Error(`${sym}: пустой ответ`);
  const rows=js.map(x=>({d:x.date.slice(0,10),o:+x.open,h:+x.high,l:+x.low,c:+x.close,
    adj:(x.adjClose!=null?+x.adjClose:+x.close),div:(+x.divCash||0)}));
  log(`${sym}: ${rows.length} дн., бар ${rows[rows.length-1].d} (Tiingo)`);
  return rows;
}

/* ---- ISO-неделя ---- */
function isoWeekKey(dt){
  const day=(dt.getUTCDay()+6)%7,th=new Date(dt);th.setUTCDate(dt.getUTCDate()-day+3);
  const y=th.getUTCFullYear(),j4=new Date(Date.UTC(y,0,4));
  const w=1+Math.round(((th-j4)/864e5-3+((j4.getUTCDay()+6)%7))/7);
  return y*100+w;
}

/* ---- индикаторы (порт из бэктеста, сверено с TradingView) ---- */
function ewm(a,al){const o=new Array(a.length);let s=a[0]||0;o[0]=s;for(let i=1;i<a.length;i++){s=al*a[i]+(1-al)*s;o[i]=s;}return o;}
function smaArr(a,n){const o=new Array(a.length).fill(NaN);let s=0;for(let i=0;i<a.length;i++){s+=a[i];if(i>=n)s-=a[i-n];if(i>=n-1)o[i]=s/n;}return o;}
function cummax(a){const o=new Array(a.length);let m=-Infinity;for(let i=0;i<a.length;i++){m=Math.max(m,a[i]);o[i]=m;}return o;}
/* ADX/CHOP как полные ряды (не только текущее значение) — нужны для прогона машины
   ядра по недельным барам истории, а не только «сейчас». */
function taSeries(rows,n=14){
  const N=rows.length,tr=new Array(N).fill(0),pdm=new Array(N).fill(0),mdm=new Array(N).fill(0);
  for(let i=1;i<N;i++){const h=rows[i].h,l=rows[i].l,pc=rows[i-1].c;
    tr[i]=Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc));
    const up=h-rows[i-1].h,dn=rows[i-1].l-l;pdm[i]=(up>dn&&up>0)?up:0;mdm[i]=(dn>up&&dn>0)?dn:0;}
  const a=1/n,atr=ewm(tr,a),pd=ewm(pdm,a),md=ewm(mdm,a),dx=new Array(N).fill(0);
  for(let i=0;i<N;i++){const p=100*pd[i]/(atr[i]||1e-9),m=100*md[i]/(atr[i]||1e-9);dx[i]=(p+m)?100*Math.abs(p-m)/(p+m):0;}
  const adxArr=ewm(dx,a),chopArr=new Array(N).fill(NaN);
  for(let i=n-1;i<N;i++){let s=0,hi=-1e9,lo=1e9;for(let j=i-n+1;j<=i;j++){s+=tr[j];hi=Math.max(hi,rows[j].h);lo=Math.min(lo,rows[j].l);}chopArr[i]=100*Math.log10(s/(hi-lo))/Math.log10(n);}
  return{adxArr,chopArr,adx:adxArr[N-1],chop:chopArr[N-1]};
}
function weeklyCloses(rows){const wk=[];let cur=null,last=null;
  for(let i=0;i<rows.length;i++){const r=rows[i];const dt=new Date(r.d+'T12:00:00Z');
    const day=(dt.getUTCDay()+6)%7,th=new Date(dt);th.setUTCDate(dt.getUTCDate()-day+3);
    const y=th.getUTCFullYear(),j4=new Date(Date.UTC(y,0,4));
    const w=1+Math.round(((th-j4)/864e5-3+((j4.getUTCDay()+6)%7))/7),key=y*100+w;
    if(key!==cur){if(last)wk.push(last);cur=key;}last={key,c:r.c,d:r.d,i};}
  if(last)wk.push(last);return wk;}

/* ---- МАШИНА СОСТОЯНИЙ МОДУЛЯ (порт run_module из бэктеста + разгрузка v2.2) ----
   Прогон по дневным закрытиям QQQ. Три аллокационных состояния:
     RISKOFF = 20/80 (растяжение), BASE = 40/60 (по умолчанию), RISKON = 60/40 (тренд).
   Переходы: D≥20% → RISKOFF немедленно (из любого состояния); RISKOFF→BASE при D<12%
   три закрытия подряд; латч растяжения (20/18) блокирует вход в разгон; наклон EMA20
   двигает BASE↔RISKON (подтверждения 5/3). Красный/жёлтый в приоритете.
   Вес — чистая функция state: RISKOFF 20, BASE 40, RISKON 60. */
function runModule(closes,ema20,sma200){
  const N=closes.length,{ENTER,EXIT,CIN,COUT,DOX,DREL,DRET,CRET,YEL,RED,SW}=MOD;
  let state='BASE',ci=0,co=0,cr=0,pending=null,overext=false,ath=-Infinity,prev='BASE';
  let out=null;
  for(let i=0;i<N;i++){
    ath=Math.max(ath,closes[i]);
    const dd=closes[i]/ath-1;
    const slope=(i>=SW&&ema20[i-SW])?ema20[i]/ema20[i-SW]-1:NaN;
    const D=sma200[i]?closes[i]/sma200[i]-1:NaN;
    if(!isNaN(D)){if(D>=DOX)overext=true;else if(D<DREL)overext=false;}
    prev=state;
    let ns;
    if(dd<=RED){ns='CORE_OFF';ci=co=cr=0;pending=null;}
    else if(dd<=YEL){ns='BASE';ci=co=cr=0;pending=null;}                 // жёлтый → база
    else if(!isNaN(D)&&D>=DOX){ns='RISKOFF';ci=co=cr=0;pending=null;}     // растяжение → разгрузка
    else{
      ns=(state==='CORE_OFF')?'BASE':state;
      if(ns==='RISKOFF'){                                                // выход из разгрузки: D<12% ×3
        if(!isNaN(D)&&D<DRET){cr++;if(cr>=CRET){ns='BASE';cr=0;}}
        else cr=0;
      }else if(ns==='BASE'){
        const want=(!isNaN(slope)&&slope>ENTER&&!overext)?'RISKON':null;
        if(want&&want===pending)ci++;
        else if(want){pending=want;ci=1;}
        else{pending=null;ci=0;}
        if(pending&&ci>=CIN){ns=pending;pending=null;ci=0;}
      }else if(ns==='RISKON'){
        if(!isNaN(slope)&&slope<EXIT){co++;if(co>=COUT){ns='BASE';co=0;}}
        else co=0;
      }
    }
    state=ns;
    out={state,prev,ci,co,cr,pending,slope,D,dd,overext};
  }
  return out;
}

/* ---- ВИД КАРТОЧКИ МОДУЛЯ (стандартный режим) ----
   Приоритет: жёлтая зона → отклонение от SMA200 → фаза тренда.
   ddFrac — живая просадка (доля), m — состояние последнего бара.
   Регистр профессиональный; долю показываем в заголовке, «Действие:»
   её не дублирует (в покое — «доля без изменений»). */
function moduleView(m,ddFrac){
  const sl=m.slope*100, D=m.D*100;
  const DOT={acc:'var(--acc)',base:'var(--sec)',warn:'var(--warn-dot)',ok:'var(--ok-dot)'};
  const COL={acc:'var(--acc)',base:'var(--sec)',warn:'var(--warn)',ok:'var(--ok)'};
  const wOf=s=>({RISKOFF:20,BASE:40,RISKON:60,CORE_OFF:40})[s]||40;
  const rebal=wOf(m.state)!==wOf(m.prev);               // доля изменилась на этом баре → прямой ребаланс
  let label,dot,col,dist,ind,act;

  if(ddFrac<=MOD.YEL){                                   // жёлтая зона → базовая доля 40/60
    label='жёлтая зона';dot=DOT.warn;col=COL.warn;dist=W40;
    ind=[`просадка QQQ <b>${pc1(ddFrac*100)}</b> — глубже −5,3%`,`сигнал по тренду не применяется, доля принудительно базовая`];
    act=W40;
  }else if(m.state==='RISKOFF'){                         // сниженная доля 20/80
    dist=W20;dot=DOT.warn;col=COL.warn;
    if(m.cr>0){                                          // отклонение снижается → базовая доля
      label='отклонение от SMA200 снижается → базовая доля';
      ind=[`цена относительно SMA200: <b>${pc1(D)}</b> — ниже порога 12%`,`возврат к базовой доле: <b>${m.cr}</b> из 3 подтверждений`];
      act='сниженная доля '+W20+'; при 3-м подтверждении → базовая '+W40;
    }else{                                               // сниженная доля удерживается отклонением
      label='значительное отклонение цены от SMA200';
      ind=[`цена относительно SMA200: <b>${pc1(D)}</b> — выше 20%`,`возврат к базовой доле при +12% и ниже (3 закрытия подряд)`];
      act=W20;
    }
  }else if(m.state==='RISKON'){
    dist=W60;dot=DOT.acc;col=COL.acc;
    if(m.co>0){                                          // тренд ослабевает → базовая доля
      label='тренд ослабевает → базовая доля';
      ind=[`наклон EMA20: <b>${pc2(sl)}</b> — ниже +0,4%, тренд ослабевает`,`снижение доли: <b>${m.co}</b> из 3 подтверждений`];
      act='повышенная доля '+W60+'; при 3-м подтверждении → базовая '+W40;
    }else{                                               // устойчивый восходящий тренд
      label='устойчивый восходящий тренд';
      ind=[`наклон EMA20: <b>${pc2(sl)}</b> — восходящий (снижение доли ниже +0,4%)`,`цена относительно SMA200: <b>${pc1(D)}</b> (лимит отклонения 20%)`,`просадка в норме`];
      act=W60;
    }
  }else{                                                 // базовая доля 40/60
    dist=W40;
    if(m.overext&&!isNaN(m.slope)&&m.slope>MOD.ENTER){   // наращивание доли заблокировано отклонением (D в 18–20%)
      label='восходящий тренд, но отклонение от SMA200 блокирует наращивание';dot=DOT.warn;col=COL.warn;
      ind=[`наклон EMA20: <b>${pc2(sl)}</b> — выше +0,9%, тренд присутствует`,`цена относительно SMA200: <b>${pc1(D)}</b> — отклонение выше нормы, наращивание доли запрещено`,`ограничение снимается при +18% и ниже`];
      act=W40;
    }else if(m.pending==='RISKON'&&m.ci>0){              // тренд усиливается → повышенная доля
      label='тренд усиливается → повышенная доля';dot=DOT.acc;col=COL.acc;
      ind=[`наклон EMA20: <b>${pc2(sl)}</b> — выше +0,9%`,`переход к повышенной доле: <b>${m.ci}</b> из 5 подтверждений`,`цена относительно SMA200: <b>${pc1(D)}</b> (лимит 20%)`];
      act='базовая доля '+W40+'; при 5-м подтверждении → повышенная '+W60;
    }else{                                               // тренд отсутствует → базовая доля
      label='тренд отсутствует → базовая доля';dot=DOT.base;col=COL.base;
      ind=[`наклон EMA20: <b>${pc2(sl)}</b> — ниже +0,9%, тренд отсутствует`,`цена относительно SMA200: <b>${pc1(D)}</b> (лимит 20%)`,`просадка в норме`];
      act=W40;
    }
  }
  if(act===dist)act='доля без изменений';                // не дублируем долю из заголовка
  if(rebal)act='ребалансировка → '+dist;                // на баре смены доли — прямое указание
  return{label,dot,col,dist,ind,act};
}

/* сборка карточки состояния */
function scard(v){

/* ---- МАШИНА ЯДРА ----
   Страница только сигналит — исполнение и журнал сделок остаются за пользователем.
   Пороги от ATH: EXIT −11,2% (выход ОБОИХ крыльев, сплит пулов → 60/40,
   выключение модуля), T1 −20,6%, T2 −29,5%, T3 −41,5% (лестница TQQQ из боезапаса).

   v3.1: при недельном закрытии ≤ −11,2% оба крыла полностью в SGOV; капитал
   сводится в сплит боезапас TQQQ 60% / резерв QDTE 40% (часть кэша доходного
   крыла переливается в боезапас). Ступень QDTE −20% удалена. Возврат QDTE —
   ОДНОЙ ступенью: недельное закрытие выше уровня −11,2% + ADX>25 + CHOP<45.

   ТАЙМФРЕЙМ (I-4): сигналы выхода и возврата проверяются ТОЛЬКО на закрытии недели.
   Внутри недели фаза не меняется. Транши — исключение: лимитки исполняются по
   внутридневному касанию в любой день.
   ЛЕСТНИЦА НАКОПИТЕЛЬНА (I-6): транши — заявки на ФИКСИРОВАННЫХ ценах, выставленных
   в момент выхода. Один раз за цикл; отскоком не отменяются. Сброс — при новом ATH.
   РЕФЕРЕНС ВОЗВРАТА (I-7): цена уровня выхода (−11,2%), либо цена самого глубокого
   ИСПОЛНЕННОГО транша — зафиксированное число, не пересчёт от текущего ATH.
   I-8: ложные циклы (выход → возврат выше цены выхода без траншей). Два подряд — флаг. */
const CORE={EXIT:-0.112,T1:-0.206,T2:-0.295,T3:-0.415};
const RUNG=[['T1',-0.206],['T2',-0.295],['T3',-0.415]];

function runCoreTQQQ(rows,weekEnd){
  let out=false;               // в кризисе (вышли)
  let exitPx=null;             // цена уровня выхода (фикс.)
  let rungPx=[0,0,0];          // фикс. цены лимиток траншей
  let fired=[false,false,false];
  let ref=null;                // референс возврата (фикс. цена)
  let ath=-Infinity;
  let falseRow=0, flagI8=false;
  let justExited=false;

  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    const prevAth=ath;
    ath=Math.max(ath,r.c);
    justExited=false;

    if(out){
      // транши: внутридневное касание, одноразово, в любой день (I-6)
      for(let j=0;j<3;j++){
        if(!fired[j] && r.l<=rungPx[j]){ fired[j]=true; ref=rungPx[j]; }
      }
    }else if(ath>prevAth && prevAth>-Infinity){
      // новый ATH вне кризиса — цикл лестницы закрыт, флаги сброшены (I-6)
      fired=[false,false,false]; falseRow=0;
    }

    if(weekEnd[i]){                       // ТОЛЬКО закрытие недели (I-4)
      const dd=r.c/ath-1;
      if(!out){
        if(dd<=CORE.EXIT){
          out=true;
          exitPx=ath*(1+CORE.EXIT);
          rungPx=RUNG.map(([,th])=>ath*(1+th));
          fired=[false,false,false];
          ref=exitPx;                     // траншей ещё нет → референс = цена выхода
          justExited=true;
        }
      }else if(r.c>ref && r.adx>25 && r.chop<45){
        // I-8: ложный цикл = вернулись выше цены самого выхода, транши не срабатывали
        if(!fired[0] && !fired[1] && !fired[2] && r.c>exitPx) falseRow++;
        else falseRow=0;
        if(falseRow>=2) flagI8=true;
        out=false; exitPx=null; ref=null; fired=[false,false,false];
      }
    }
  }
  let depth='EXIT';
  for(let j=0;j<3;j++) if(fired[j]) depth=RUNG[j][0];
  return{out,depth,fired,ref,exitPx,rungPx,flagI8,falseRow,justExited,ath,
         phase: out?depth:null};
}

function runCoreQDTE(rows,weekEnd){
  /* v3.1: две фазы. FULL (держим 100%) → OUT (100% в SGOV) при недельном закрытии
     ≤ −11,2%. Возврат — одной ступенью: закрытие выше уровня −11,2% + ADX>25 + CHOP<45.
     Ступень −20% удалена. */
  let phase='FULL', ath=-Infinity, outRef=null;
  let retReady=false;                     // условие возврата выполнено на посл. недельном закрытии
  let justOut=false;                      // выход произошёл именно на последнем баре
  for(let i=0;i<rows.length;i++){
    const r=rows[i]; ath=Math.max(ath,r.c);
    justOut=false;
    if(!weekEnd[i]) continue;             // ТОЛЬКО закрытие недели (II-2, II-3)
    const dd=r.c/ath-1;
    retReady=false;
    if(phase==='FULL'){
      if(dd<=CORE.EXIT){phase='OUT'; outRef=ath*(1+CORE.EXIT); justOut=true;}
    }else{ // OUT
      if(outRef!==null && r.c>outRef && r.adx>25 && r.chop<45){phase='FULL'; outRef=null; retReady=true;}
    }
  }
  /* outRef — ЗАФИКСИРОВАННАЯ цена уровня −11,2% (от ATH на момент выхода);
     карточка сверяется с ней, а не пересчитывает от текущего ATH */
  return{phase,outRef,retReady,justOut,ath};
}

    /* машина ядра. Фаза меняется ТОЛЬКО на закрытии недели (I-4). Живая цена
       добавляется отдельным баром, лишь если текущая неделя УЖЕ закрыта (пятница
       позади) — иначе внутринедельное движение фазу не двигает; для него ниже
       считается предварительное предупреждение. */
    const coreRows=q.map((r,i)=>({c:r.c,l:r.l,adx:adxArr[i],chop:chopArr[i]}));
    const weekEnd=new Array(q.length).fill(false);
    for(const w of wk) weekEnd[w.i]=true;
    /* Последний бар помечаем концом недели только если неделя реально закрыта.
       Если торговая неделя ещё идёт — сигналов выхода/возврата нет (I-4),
       но транши по касанию продолжают действовать (они дневные). */
    if(!weekDone) weekEnd[q.length-1]=false;
    /* живая цена: обновляет только внутридневной Low ТЕКУЩЕГО бара (для лимиток),
       закрытие последнего бара не подменяем, пока неделя не закрыта */
    if(live){
      const li=coreRows.length-1;
      coreRows[li]={...coreRows[li], l:Math.min(coreRows[li].l,curW), c:(weekDone?curW:coreRows[li].c)};
    }
    const tqCore=runCoreTQQQ(coreRows,weekEnd);
    const qdCore=runCoreQDTE(coreRows,weekEnd);
    const standard=(tqCore.phase===null);

    /* предварительное предупреждение: неделя ещё идёт, но текущая цена уже ниже
       уровня — если неделя закроется так, сработает выход. Фазу не меняем. */
    const preExit=(!weekDone)&&standard&&(curW<=tqCore.ath*(1+CORE.EXIT));

    const L={};for(const k in MULT)L[k]=ath*MULT[k];
    const tqAt=k=>tqCur?tqCur*Math.pow(L[k]/cur,3):null;

    /* мастер-статус (цвет от просадки QQQ) */
    let stName,stCls;
    if(dd>DD.yellow){stName='норма';stCls='b-ok';}
    else if(dd>DD.exit){stName='жёлтый';stCls='b-warn';}
    else{stName='красный';stCls='b-red';}

    /* шапка */
    $('hdr').innerHTML=`QQQ <b>${fmt(cur)}</b>${live?' <span class="live">LIVE</span>':''} · ATH <b>${fmt(ath)}</b> · просадка <b>${pc1(dd)}</b>`;
    $('hdr-badge').innerHTML=`<span class="badge ${stCls}"><span class="dot"></span>${stName}</span>`;

    /* плашка режима (информационная — фаза определяется автоматически) */
    $('regime').innerHTML=standard
      ? `<div class="regime"><div class="t">Обычный режим — долями управляет модуль</div><div class="s">отклонение от SMA200 выше нормы → сниженная ${W20} · норма → базовая ${W40} · устойчивый тренд → повышенная ${W60}</div></div>`
      : `<div class="regime crisis"><div class="t">Кризис — управляет ядро</div><div class="s">модуль выключен · оба компонента в SGOV, капитал в распределении 60/40 · TQQQ докупается ступенчато из закупочного резерва · QDTE возвращается одной ступенью</div></div>`;

    /* ================= TQQQ ================= */
    $('tq-nums').innerHTML=`QQQ <b>${fmt(cur)}</b>`+(tqCur?` · TQQQ <b>${fmt(tqCur)}</b>`:'');
    const priceCell=(k,q)=>{const tq=tqAt(k);return tq!=null?`${f1(tq)} <span class="paren">(${fmt(q)})</span>`:`${fmt(q)}`;};
    const priceRaw=(tqv,qv)=>tqv!=null?`${f1(tqv)} <span class="paren">(${fmt(qv)})</span>`:`${fmt(qv)}`;

    if(standard){
      /* уровни: ATH, текущий, жёлтый, выход */
      const tqAthP=tqCur?tqCur*Math.pow(ath/cur,3):null;
      $('tq-left').innerHTML=`<div class="lvls">`+
        `<div class="h"><span></span><span>${tqCur?'TQQQ (QQQ)':'QQQ'}</span></div>`+
        `<div class="l"><span class="c-m">ATH</span><span>${priceRaw(tqAthP,ath)}</span></div>`+
        `<div class="l"><span class="c-cur">сейчас ${pc1(dd)}</span><span>${priceRaw(tqCur,cur)}</span></div>`+
        `<div class="l"><span class="c-y">−5,3% жёлтый</span><span>${priceCell('yellow',L.yellow)}</span></div>`+
        `<div class="l"><span class="c-r">−11,2% выход</span><span>${priceCell('exit',L.exit)}</span></div>`+
        `</div>`;
      /* карточка модуля (пробой −11,2% теперь выводит в crisis-ветку автоматически) */
      /* preExit: цена внутри недели уже ниже −11,2%, но неделя не закрыта — фаза
         НЕ меняется (I-4), показываем предупреждение поверх карточки модуля */
      if(preExit){
        $('tq-right').innerHTML=scard({label:'Предварительно: выход',dot:'var(--warn-dot)',col:'var(--warn)',dist:'',
          ind:[`цена <b>${fmt(curW)}</b> ниже уровня −11,2% (<b>${fmt(tqCore.ath*(1+CORE.EXIT))}</b>)`,
               `неделя не закрыта — сигнала пока нет`,
               `если неделя закроется так, в понедельник: оба компонента (TQQQ и QDTE) → SGOV, капитал в распределение 60/40`],
          act:'ждать закрытия недели · сделок пока нет'});
      }else{
        $('tq-right').innerHTML=scard(moduleView(mod,ddFrac));
      }
      $('tq-hint').style.display='';
      $('tq-hint').textContent='Наклон EMA20 и цена относительно SMA200 считаются по дневному закрытию QQQ. Сигналы выхода и возврата срабатывают только на закрытии недели; докупка траншами — по касанию цены в любой день.';
    }else{
      /* кризис: лестница ядра. Цены лимиток ЗАФИКСИРОВАНЫ в момент выхода (I-6),
         сработавшие транши помечены — они одноразовы и отскоком не отменяются. */
      const RG=[['t1','−20,6% транш 1',0],['t2','−29,5% транш 2',1],['t3','−41,5% транш 3',2]];
      const tqAtPx=px=>tqCur?tqCur*Math.pow(px/cur,3):null;
      let rows=`<div class="h"><span></span><span>${tqCur?'TQQQ (QQQ)':'QQQ'}</span></div>`+
        `<div class="l"><span class="c-cur">сейчас ${pc1(dd)}</span><span>${priceRaw(tqCur,cur)}</span></div>`+
        `<div class="l"><span class="c-r">−11,2% выход</span><span>${priceRaw(tqAtPx(tqCore.exitPx),tqCore.exitPx)}</span></div>`;
      for(const [k,lbl,j] of RG){
        const px=tqCore.rungPx[j], done=tqCore.fired[j];
        rows+=`<div class="l"><span class="${done?'c-ok':'c-m'}">${done?'✓ ':''}${lbl}</span>`+
              `<span class="${done?'c-ok':''}">${priceRaw(tqAtPx(px),px)}</span></div>`;
      }
      $('tq-left').innerHTML=`<div class="lvls">${rows}</div>`;

      const nFired=tqCore.fired.filter(Boolean).length;
      const invested=[0,10,35,100][nFired];              // накоплено в позиции, % закупочного резерва
      const posTxt=nFired===3?'в позиции 100%, ступени докупки отработаны'
                 :nFired===0?'в SGOV 100%'
                 :`в позиции ${invested}%, в SGOV ${100-invested}%`;
      const nxtIdx=tqCore.fired.findIndex(f=>!f);
      const nxtName=nxtIdx>=0?['транш 1','транш 2','транш 3'][nxtIdx]:null;
      const nxtPx=nxtIdx>=0?tqCore.rungPx[nxtIdx]:null;
      const okRe=curW>tqCore.ref&&adx>25&&chop<45;       // опорная цена — ЗАФИКСИРОВАННАЯ (I-7)
      const refTxt=`${fmt(tqCore.ref)}`+(nFired?` (транш ${nFired})`:' (уровень выхода)');
      let label,ind;
      if(tqCore.justExited){label='Красный · выход';
        ind=[`пересечён −11,2% (недельное закрытие)`,
             `продать 100% TQQQ и 100% QDTE → SGOV`,
             `свести капитал в распределение 60/40: закупочный резерв TQQQ 60% · резерв QDTE 40%`,
             `ступени докупки 10 / 25 / 65 от закупочного резерва · транш 1 на уровне QQQ ${fmt(tqCore.rungPx[0])}`];
      }else if(okRe){label='Красный · возврат';
        ind=[`закрытие выше опорной цены ${refTxt}`,`вернуть остаток в позицию`+(weekDone?'':' (неделя не закрыта)'),
             `ADX ${adx.toFixed(1)} &gt; 25 · CHOP ${chop.toFixed(1)} &lt; 45 — фильтр пройден`];
      }else{label='Красный · в кэше';
        const nx=nxtPx!=null?tqAtPx(nxtPx):null;
        const foreL=nxtName?`${nxtName} — лимитная заявка на ${nx!=null?f1(nx)+' (QQQ '+fmt(nxtPx)+')':'QQQ '+fmt(nxtPx)}`
                           :'ступени докупки отработаны — ожидается возврат остатка';
        ind=[posTxt,foreL,
             `возврат: закрытие выше ${refTxt} + ADX&gt;25 + CHOP&lt;45 · сейчас ADX ${adx.toFixed(1)}, CHOP ${chop.toFixed(1)}`];
      }
      $('tq-right').innerHTML=scard({label,dot:'var(--red-dot)',col:'var(--red)',dist:'',ind,act:''});
      $('tq-hint').style.display='none';
    }

    /* ================= QDTE ================= */
    $('qd-nums').innerHTML=(qdCur?`QDTE <b>${fmt(qdCur)}</b> <span class="ref">(справочно)</span> · `:'')+`ADX ${adx.toFixed(1)} · CHOP ${chop.toFixed(1)}`;
    $('qd-left').innerHTML=`<div class="lvls">`+
      `<div class="h"><span></span><span>QQQ</span></div>`+
      `<div class="l"><span class="c-ok">норма</span><span class="c-ok">&gt;${fmt(L.yellow)}</span></div>`+
      `<div class="l"><span class="c-y">−5,3% жёлтый</span><span class="c-y">${fmt(L.yellow)}</span></div>`+
      `<div class="l"><span class="c-r">−11,2% красный</span><span class="c-r">${fmt(L.exit)}</span></div>`+
      `</div>`;

    if(standard){
      /* держим 100%, различие только в судьбе выплат (норма/жёлтый) */
      let ind,act;
      if(dd>DD.yellow){
        ind=[`просадка QQQ <b>${pc1(dd)}</b> · норма`,`красный −11,2%: не достигнут`];
        act='держать 100%, выплаты реинвестировать';
      }else{
        ind=[`просадка QQQ <b>${pc1(dd)}</b> ≤ −5,3% · жёлтый`,`красный −11,2%: не достигнут`];
        act='держать 100%, выплаты — в SGOV';
      }
      $('qd-right').innerHTML=scard({label:'Держать 100%',dot:'var(--ok-dot)',col:'var(--ok)',dist:'',ind,act});
    }else{
      /* кризис v3.1: две фазы. FULL — TQQQ уже в кризисе, но QDTE-машина ещё не
         увидела недельное закрытие ≤ −11,2%. OUT — вышли 100% в SGOV, часть капитала
         переведена в боезапас TQQQ (сплит 60/40). Возврат — одной ступенью по
         зафиксированной цене уровня −11,2% (outRef), не пересчёт от текущего ATH. */
      const qs=qdCore.phase;let label,dot,col,ind,act;
      if(qs==='FULL'){
        label='Держать 100%';dot='var(--ok-dot)';col='var(--ok)';
        ind=[`фаза QDTE меняется по недельному закрытию`,
             `при недельном закрытии ≤ −11,2% — выход 100% → SGOV, перелив в закупочный резерв TQQQ`];
        act='держать 100%, выплаты — в SGOV';
      }else{ // OUT
        const okBack=qdCore.outRef!==null&&curW>qdCore.outRef&&adx>25&&chop<45;
        label='Красный · выход 100%';dot='var(--red-dot)';col='var(--red)';
        if(qdCore.justOut){
          ind=[`пересечён −11,2% (недельное закрытие)`,
               `продать 100% QDTE → SGOV`,
               `20% портфеля → в закупочный резерв TQQQ (распределение 60/40), 40% — резерв QDTE`];
          act='выход 100% → SGOV · перелив в закупочный резерв';
        }else if(okBack){
          ind=[`закрытие выше уровня −11,2% ${fmt(qdCore.outRef)}`,
               `ADX ${adx.toFixed(1)} &gt; 25 · CHOP ${chop.toFixed(1)} &lt; 45 — фильтр пройден`+(weekDone?'':' (неделя не закрыта)')];
          act='вернуть резерв (40%) в QDTE';
        }else{
          ind=[`в SGOV 100% (резерв 40% портфеля), ждём возврат`,
               `возврат: закрытие выше ${qdCore.outRef?fmt(qdCore.outRef):'—'} + ADX&gt;25 + CHOP&lt;45 · сейчас ADX ${adx.toFixed(1)}, CHOP ${chop.toFixed(1)}`];
          act='держать резерв в SGOV';
        }
      }
      $('qd-right').innerHTML=scard({label,dot,col,dist:'',ind,act});
    }

    /* здоровье выплат */
    let hHtml;
    if(qdDivs&&qdDivs.length>=1){
      const lastD=qdDivs[qdDivs.length-1].a;
      const prev=qdDivs.slice(Math.max(0,qdDivs.length-4),qdDivs.length-1);
      const avg=prev.length?prev.reduce((s,x)=>s+x.a,0)/prev.length:lastD;
      const delta=100*(lastD/avg-1);
      let cls,lab;
      if(prev.length<2){cls='bs-warn';lab='мало данных';}
      else if(delta<=-25){cls='bs-red';lab='падение';}
      else if(delta>=10){cls='bs-ok';lab='рост';}
      else{cls='bs-ok';lab='норма';}
      hHtml=`<div class="health-head"><span class="t">Здоровье фонда · тренд выплат</span><span class="badge ${cls}"><span class="dot"></span>${lab}</span></div>`+
        `<div class="health-cells">`+
        `<div class="hc"><div class="n">$${lastD.toFixed(4)}</div><div class="c">последняя</div></div>`+
        `<div class="hc"><div class="n">$${avg.toFixed(4)}</div><div class="c">средняя (${prev.length||1})</div></div>`+
        `<div class="hc"><div class="n" style="color:${delta<=-25?'var(--red)':'var(--ok)'}">${delta>=0?'+':''}${delta.toFixed(1)}%</div><div class="c">отклонение</div></div>`+
        `</div><div style="font-size:.8rem;color:var(--muted);margin-top:11px">Тревога при падении &gt;25% к средней и снижающейся цене пая. Порог −25% — инженерная оценка.</div>`;
    }else{
      hHtml=`<div class="health-head"><span class="t">Здоровье фонда · тренд выплат</span><span class="badge bs-warn"><span class="dot"></span>нет данных</span></div>`+
        `<div style="font-size:.9rem;color:var(--sec)">История выплат QDTE недоступна. Вносите выплаты в журнал вручную.</div>`;
    }
    $('qd-health').innerHTML=hHtml;

    /* I-8: два ложных цикла подряд — третий выход НЕ автоматический, решение на человеке */
    if(tqCore.flagI8){
      $('warnbar').style.display='';
      $('warnbar').innerHTML='<b>I-8: два последовательных выхода оказались ложными</b> — цена колеблется у уровня −11,2%. '+
        'Третий выход система автоматически не исполняет: решение остаётся за вами — боковое движение (сохранять позицию, приостановить выходы) '+
        'или начало нисходящего разворота (выход обоснован). Ступенчатая докупка при любом решении продолжает действовать.';
    }else if(Math.abs(dd)<=0.1){$('warnbar').style.display='';$('warnbar').textContent='QQQ на новом максимуме: пересчитать уровни, обновить ценовые оповещения.';}
    $('out').style.display='';
  }catch(e){log('ОШИБКА: '+e.message);$('warnbar').style.display='';$('warnbar').textContent='Ошибка: '+e.message;$('meta').textContent='ошибка загрузки';}
}

/* автозапуск при открытии; обновление — перезагрузкой (F5) */
runAdvisor().then(()=>{window.__loaded=true;});
</script>
</body>
</html>
